name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Typecheck, Unit Tests & Compose Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install -r requirements-dev.txt
          pip install --no-deps -r requirements-tsb-ad.txt

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Mypy static type check
        run: mypy

      - name: Pytest with coverage (>= 85%)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml config -q

      - name: Run lightweight M4 comparative ML benchmark smoke test (no external downloads)
        run: |
          python - <<'PY'
          import csv, json, tempfile
          from pathlib import Path
          import numpy as np
          from app.m4_benchmark import main as m4_main

          rng = np.random.default_rng(42)
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              skab = root / "skab" / "data"
              (skab / "valve1").mkdir(parents=True)
              (skab / "anomaly-free").mkdir(parents=True)

              # Fault SKAB experiment (semicolon-delimited, separate anomaly & changepoint)
              rows_fault = ["datetime;Accelerometer1RMS;Pressure;Temperature;anomaly;changepoint"]
              for i in range(160):
                  is_anom = 1 if 110 <= i < 140 else 0
                  is_cp = 1 if i in (110, 140) else 0
                  shift = 8.0 if is_anom else 0.0
                  v1 = 0.5 + 0.03 * rng.normal() + 0.4 * shift
                  p1 = 5.0 + 0.05 * rng.normal() + shift
                  t1 = 50.0 + 0.1 * rng.normal() + 2.0 * shift
                  rows_fault.append(
                      f"2026-01-01 00:{i // 60:02d}:{i % 60:02d};{v1:.4f};{p1:.4f};{t1:.4f};{is_anom};{is_cp}"
                  )
              (skab / "valve1" / "0.csv").write_text("\n".join(rows_fault) + "\n", encoding="utf-8")

              rows_af = ["datetime;Accelerometer1RMS;Pressure;Temperature"]
              for i in range(120):
                  v1 = 0.5 + 0.03 * rng.normal()
                  p1 = 5.0 + 0.05 * rng.normal()
                  t1 = 50.0 + 0.1 * rng.normal()
                  rows_af.append(
                      f"2026-01-02 00:{i // 60:02d}:{i % 60:02d};{v1:.4f};{p1:.4f};{t1:.4f}"
                  )
              (skab / "anomaly-free" / "anomaly-free.csv").write_text(
                  "\n".join(rows_af) + "\n", encoding="utf-8"
              )

              # Official-format TSB-AD-M fixture (_tr_100_1st_130.csv + TSB-AD-M-Eva.csv)
              tsb = root / "tsb_ad_m"
              (tsb / "TSB-AD-M").mkdir(parents=True)
              fname = "001_Synth_id_1_Sensor_tr_100_1st_130.csv"
              (tsb / "TSB-AD-M-Eva.csv").write_text(f"file_name\n{fname}\n", encoding="utf-8")
              tsb_rows = ["ch0,ch1,ch2,Label"]
              for i in range(180):
                  lbl = 1 if 130 <= i < 155 else 0
                  bump = 7.0 if lbl else 0.0
                  c0 = float(np.sin(i / 5.0)) + 0.05 * rng.normal() + bump
                  c1 = float(np.cos(i / 5.0)) + 0.05 * rng.normal() + bump
                  c2 = 1.0 + 0.05 * rng.normal() + bump
                  tsb_rows.append(f"{c0:.5f},{c1:.5f},{c2:.5f},{lbl}")
              (tsb / "TSB-AD-M" / fname).write_text("\n".join(tsb_rows) + "\n", encoding="utf-8")

              out_dir = root / "out_m4"
              rc = m4_main([
                  "--run-id", "ci_smoke",
                  "--seed", "42",
                  "--skab-dir", str(root / "skab"),
                  "--tsb-dir", str(tsb),
                  "--output-dir", str(out_dir),
              ])
              assert rc == 0, f"m4_benchmark failed with exit code {rc}"
              for name in (
                  "benchmark_report.json",
                  "benchmark_report.md",
                  "comparison_summary.csv",
                  "per_experiment_metrics.csv",
              ):
                  f = out_dir / name
                  assert f.exists() and f.stat().st_size > 0, f"Missing/empty {f}"
              data = json.loads((out_dir / "benchmark_report.json").read_text(encoding="utf-8"))
              assert set(data["model_parameters"]) == {
                  "static_threshold",
                  "isolation_forest",
                  "half_space_trees",
              }
              with (out_dir / "per_experiment_metrics.csv").open(encoding="utf-8") as handle:
                  assert sum(1 for _ in csv.DictReader(handle)) == 9
              print("Validated M4 smoke benchmark bundle successfully")
          PY

      - name: Run lightweight M5 LSTM Autoencoder smoke test (CPU, no external downloads)
        run: |
          python - <<'PY'
          import csv, json, tempfile
          from pathlib import Path
          import numpy as np
          from app.m5_benchmark import main as m5_main

          rng = np.random.default_rng(42)
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              skab = root / "skab" / "data" / "valve1"
              skab.mkdir(parents=True)
              rows_fault = ["datetime;Accelerometer1RMS;Pressure;Temperature;anomaly;changepoint"]
              for i in range(140):
                  anom = 1 if 95 <= i < 120 else 0
                  cp = 1 if i in (95, 120) else 0
                  shift = 8.0 if anom else 0.0
                  v1 = 0.5 + 0.03 * rng.normal() + 0.4 * shift
                  p1 = 5.0 + 0.05 * rng.normal() + shift
                  t1 = 50.0 + 0.1 * rng.normal() + 2.0 * shift
                  rows_fault.append(
                      f"2026-01-01 00:{i // 60:02d}:{i % 60:02d};{v1:.4f};{p1:.4f};{t1:.4f};{anom};{cp}"
                  )
              (skab / "0.csv").write_text("\n".join(rows_fault) + "\n", encoding="utf-8")

              tsb = root / "tsb_ad_m"
              (tsb / "TSB-AD-M").mkdir(parents=True)
              fname = "001_Synth_id_1_Sensor_tr_80_1st_105.csv"
              (tsb / "TSB-AD-M-Eva.csv").write_text(f"file_name\n{fname}\n", encoding="utf-8")
              tsb_rows = ["ch0,ch1,Label"]
              for i in range(140):
                  lbl = 1 if 105 <= i < 125 else 0
                  bump = 7.0 if lbl else 0.0
                  c0 = float(np.sin(i / 5.0)) + 0.05 * rng.normal() + bump
                  c1 = 0.0  # inactive indicator channel to verify univariate handling
                  tsb_rows.append(f"{c0:.5f},{c1:.5f},{lbl}")
              (tsb / "TSB-AD-M" / fname).write_text("\n".join(tsb_rows) + "\n", encoding="utf-8")

              out_dir = root / "out_m5"
              rc = m5_main([
                  "--run-id", "ci_m5_smoke",
                  "--device", "cpu",
                  "--window-size", "8",
                  "--hidden-dim", "12",
                  "--latent-dim", "6",
                  "--num-layers", "1",
                  "--dropout", "0.0",
                  "--epochs", "4",
                  "--batch-size", "32",
                  "--skab-dir", str(root / "skab"),
                  "--tsb-dir", str(tsb),
                  "--output-dir", str(out_dir),
              ])
              assert rc == 0, f"m5_benchmark failed with exit code {rc}"
              for name in (
                  "m5_report.json",
                  "m5_report.md",
                  "comparison_summary.csv",
                  "per_experiment_metrics.csv",
              ):
                  f = out_dir / name
                  assert f.exists() and f.stat().st_size > 0, f"Missing/empty {f}"
              data = json.loads((out_dir / "m5_report.json").read_text(encoding="utf-8"))
              assert data["series_modes"] == {
                  "SKAB": "multivariate",
                  "TSB-AD-M": "independent_univariate",
              }
              with (out_dir / "per_experiment_metrics.csv").open(encoding="utf-8") as handle:
                  assert sum(1 for _ in csv.DictReader(handle)) == 8
              print("Validated M5 LSTM Autoencoder smoke bundle successfully")
          PY

      - name: Run lightweight M6 TCN Autoencoder smoke test (CPU, no external downloads)
        run: |
          python - <<'PY'
          import csv, json, tempfile
          from pathlib import Path
          import numpy as np
          from app.m6_benchmark import main as m6_main

          rng = np.random.default_rng(42)
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              skab = root / "skab" / "data" / "valve1"
              skab.mkdir(parents=True)
              rows_fault = ["datetime;Accelerometer1RMS;Pressure;Temperature;anomaly;changepoint"]
              for i in range(140):
                  anom = 1 if 95 <= i < 120 else 0
                  cp = 1 if i in (95, 120) else 0
                  shift = 8.0 if anom else 0.0
                  v1 = 0.5 + 0.03 * rng.normal() + 0.4 * shift
                  p1 = 5.0 + 0.05 * rng.normal() + shift
                  t1 = 50.0 + 0.1 * rng.normal() + 2.0 * shift
                  rows_fault.append(
                      f"2026-01-01 00:{i // 60:02d}:{i % 60:02d};{v1:.4f};{p1:.4f};{t1:.4f};{anom};{cp}"
                  )
              (skab / "0.csv").write_text("\n".join(rows_fault) + "\n", encoding="utf-8")

              tsb = root / "tsb_ad_m"
              (tsb / "TSB-AD-M").mkdir(parents=True)
              fname = "001_Synth_id_1_Sensor_tr_80_1st_105.csv"
              (tsb / "TSB-AD-M-Eva.csv").write_text(f"file_name\n{fname}\n", encoding="utf-8")
              tsb_rows = ["ch0,ch1,Label"]
              for i in range(140):
                  lbl = 1 if 105 <= i < 125 else 0
                  bump = 7.0 if lbl else 0.0
                  c0 = float(np.sin(i / 5.0)) + 0.05 * rng.normal() + bump
                  c1 = 0.0
                  tsb_rows.append(f"{c0:.5f},{c1:.5f},{lbl}")
              (tsb / "TSB-AD-M" / fname).write_text("\n".join(tsb_rows) + "\n", encoding="utf-8")

              out_dir = root / "out_m6"
              rc = m6_main([
                  "--run-id", "ci_m6_smoke",
                  "--device", "cpu",
                  "--window-size", "8",
                  "--hidden-channels", "12",
                  "--latent-dim", "4",
                  "--kernel-size", "3",
                  "--dilations", "1", "2",
                  "--dropout", "0.0",
                  "--epochs", "4",
                  "--batch-size", "32",
                  "--skab-dir", str(root / "skab"),
                  "--tsb-dir", str(tsb),
                  "--output-dir", str(out_dir),
              ])
              assert rc == 0, f"m6_benchmark failed with exit code {rc}"
              for name in (
                  "m6_report.json",
                  "m6_report.md",
                  "comparison_summary.csv",
                  "per_experiment_metrics.csv",
              ):
                  f = out_dir / name
                  assert f.exists() and f.stat().st_size > 0, f"Missing/empty {f}"
              with (out_dir / "per_experiment_metrics.csv").open(encoding="utf-8") as handle:
                  assert sum(1 for _ in csv.DictReader(handle)) == 10
              print("Validated M6 TCN Autoencoder smoke bundle successfully")
          PY

  kafka-integration:
    name: Kafka Integration & Streaming Report
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install -r requirements-dev.txt
          pip install --no-deps -r requirements-tsb-ad.txt

      - name: Ensure script permissions
        run: chmod +x scripts/*.sh

      - name: Run Kafka integration demo and report generation
        env:
          PYTHON_BIN: python
          DEMO_INTERVAL_MS: "2"
        run: ./scripts/run_demo.sh 1000

      - name: Validate generated streaming report bundle
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          report_dirs = sorted(Path("reports/runs").iterdir())
          assert len(report_dirs) == 1, f"Expected 1 report dir, got {report_dirs}"
          out = report_dirs[0]
          for name in ("report.md", "report.json", "events.csv", "latency.csv"):
              path = out / name
              assert path.exists() and path.stat().st_size > 0, f"Missing/empty {path}"

          data = json.loads((out / "report.json").read_text(encoding="utf-8"))
          assert data["delivery"]["delivered"] == 1000
          assert data["consumption"]["received"] == 1000
          assert data["consumption"]["malformed"] == 0
          assert data["consumption"]["duplicates"] == 0
          assert data["latency_ms"]["count"] == 1000
          assert data["latency_ms"]["p50_ms"] is not None

          with (out / "events.csv").open(encoding="utf-8") as handle:
              assert sum(1 for _ in csv.DictReader(handle)) == 1000
          with (out / "latency.csv").open(encoding="utf-8") as handle:
              assert sum(1 for _ in csv.DictReader(handle)) == 1000
          print(f"Validated report bundle in {out}")
          PY

      - name: Run M2 anomaly detection demo and validate evaluation report
        env:
          PYTHON_BIN: python
          DEMO_INTERVAL_MS: "2"
          DEMO_SEED: "42"
        run: |
          ./scripts/run_m2_demo.sh 300
          python - <<'PY'
          import csv, json
          from pathlib import Path

          m2_dirs = sorted(Path("reports/m2").iterdir())
          assert len(m2_dirs) == 1, f"Expected 1 M2 report dir, got {m2_dirs}"
          out = m2_dirs[0]
          for name in ("report.md", "report.json", "evaluations.csv"):
              path = out / name
              assert path.exists() and path.stat().st_size > 0, f"Missing/empty {path}"

          data = json.loads((out / "report.json").read_text(encoding="utf-8"))
          assert len(data["scenarios"]) == 3
          assert data["overall_metrics"]["tp"] > 0
          by_sc = {sc["scenario"]: sc for sc in data["scenarios"]}
          # Anomalies scenario: independent spike & stuck labels
          assert set(by_sc["anomalies"]["anomaly_breakdown"]) == {"normal", "spike", "stuck"}
          # Drift scenario: gradual baseline shift retains normal ground truth (TP=0, FN=0, FP>0)
          assert by_sc["drift"]["metrics"]["tp"] == 0
          assert by_sc["drift"]["metrics"]["fn"] == 0
          assert by_sc["drift"]["metrics"]["fp"] > 0
          assert set(by_sc["drift"]["anomaly_breakdown"]) == {"normal"}
          for sc in data["scenarios"]:
              assert sc["alerts"]["triggered"] == sc["alerts"]["delivered"]
              assert sc["alerts"]["delivered"] == sc["alerts"]["verified_on_topic"]

          with (out / "evaluations.csv").open(encoding="utf-8") as handle:
              assert sum(1 for _ in csv.DictReader(handle)) == 900
          print(f"Validated M2 report bundle in {out}")
          PY

      - name: Run M3 ADWIN drift demo and validate report & dashboard
        env:
          PYTHON_BIN: python
          DEMO_INTERVAL_MS: "2"
          DEMO_SEED: "42"
        run: |
          ./scripts/run_m3_demo.sh 500
          python - <<'PY'
          import csv, json
          from pathlib import Path

          m3_dirs = sorted(Path("reports/m3").iterdir())
          assert len(m3_dirs) == 1, f"Expected 1 M3 report dir, got {m3_dirs}"
          out = m3_dirs[0]
          for name in ("report.md", "report.json", "channel_evaluations.csv", "dashboard.html"):
              path = out / name
              assert path.exists() and path.stat().st_size > 0, f"Missing/empty {path}"

          data = json.loads((out / "report.json").read_text(encoding="utf-8"))
          by_sc = {sc["scenario"]: sc for sc in data["scenarios"]}
          assert set(by_sc) == {"normal", "drift", "abrupt_drift"}
          assert by_sc["normal"]["drift_metrics"]["expected_drift_channels"] == 0
          assert by_sc["normal"]["drift_metrics"]["false_alarms_stable"] == 0
          for sc_name in ("drift", "abrupt_drift"):
              dm = by_sc[sc_name]["drift_metrics"]
              assert dm["expected_drift_channels"] == 15
              assert dm["detected_drift_channels"] > 0
              assert (
                  dm["first_episode_detections"]
                  + dm["repeated_episode_alerts"]
                  + dm["false_alarms_stable"]
                  == dm["total_adwin_alerts"]
              )
              dt = by_sc[sc_name]["drift_topic"]
              assert dt["triggered"] == dt["delivered"] == dt["verified_on_topic"]

          with (out / "channel_evaluations.csv").open(encoding="utf-8") as handle:
              assert sum(1 for _ in csv.DictReader(handle)) == 45
          print(f"Validated M3 report & dashboard bundle in {out}")
          PY

      - name: Run 10-seed M3 robustness sweep over Kafka
        env:
          PYTHON_BIN: python
        run: |
          ./scripts/run_m3_robustness.sh 500
          python - <<'PY'
          import csv, json
          from pathlib import Path

          rob_dirs = sorted(Path("reports/m3").glob("robustness_*"))
          assert len(rob_dirs) == 1, f"Expected 1 robustness dir, got {rob_dirs}"
          out = rob_dirs[0]
          for name in ("robustness_report.json", "robustness_report.md", "seed_runs.csv"):
              path = out / name
              assert path.exists() and path.stat().st_size > 0, f"Missing/empty {path}"
          data = json.loads((out / "robustness_report.json").read_text(encoding="utf-8"))
          assert len(data["seeds"]) == 10
          with (out / "seed_runs.csv").open(encoding="utf-8") as handle:
              assert sum(1 for _ in csv.DictReader(handle)) == 30
          print(f"Validated 10-seed robustness bundle in {out}")
          PY

      - name: Print failure diagnostics
        if: failure()
        run: |
          docker compose -f docker-compose.yml ps || true
          docker compose -f docker-compose.yml logs --tail=100 kafka || true
          tail -n 50 runs/*/*.log || true

      - name: Upload run logs and streaming report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driftguard-m1-ci-report
          path: |
            runs/
            reports/runs/
            reports/m2/
            reports/m3/
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down Kafka broker
        if: always()
        run: docker compose -f docker-compose.yml down -v
