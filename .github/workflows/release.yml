name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-package:
    name: Verify & Package Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run lint, typecheck, and unit tests
        run: |
          ruff check app tests
          ruff format --check app tests
          mypy
          pytest --cov --cov-report=term-missing --cov-fail-under=85
          docker compose -f docker-compose.yml config -q

      # Note: No custom Dockerfile exists in M1 (the project uses upstream
      # apache/kafka:4.3.2 via docker-compose.yml), so GHCR image publishing is
      # intentionally skipped until a service Dockerfile is added.

      - name: Build and verify release archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          ARCHIVE="dist/driftguard-kafka-${TAG}.tar.gz"
          tar --exclude='.git' --exclude='.venv' --exclude='runs' --exclude='reports' \
              --exclude='.env' --exclude='dist' --exclude='__pycache__' \
              -czf "${ARCHIVE}" .
          tar -tzf "${ARCHIVE}" | head -n 20
          (cd dist && sha256sum "driftguard-kafka-${TAG}.tar.gz" > "driftguard-kafka-${TAG}.tar.gz.sha256")
          (cd dist && sha256sum -c "driftguard-kafka-${TAG}.tar.gz.sha256")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/driftguard-kafka-${{ github.ref_name }}.tar.gz
            dist/driftguard-kafka-${{ github.ref_name }}.tar.gz.sha256
